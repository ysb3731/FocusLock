name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 서명 키가 등록되어 있으면: 플레이 스토어용 AAB + 서명된 APK
      - name: 서명 키 준비
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: 출시용 빌드 (AAB + APK)
        if: env.HAS_KEY == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          gradle bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab FocusLock-playstore.aab
          cp app/build/outputs/apk/release/app-release.apk FocusLock.apk

      # 서명 키가 없으면: 바로 설치해 볼 수 있는 테스트용 APK
      - name: 테스트용 빌드 (APK)
        if: env.HAS_KEY != 'true'
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FocusLock.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 숨 고르기 1.0.${{ github.run_number }}
          body: |
            폰에서 FocusLock.apk 를 받아 설치하세요.
            FocusLock-playstore.aab 가 있으면 그 파일을 Play Console 에 올리면 됩니다.
          files: |
            FocusLock.apk
            FocusLock-playstore.aab
          fail_on_unmatched_files: false
