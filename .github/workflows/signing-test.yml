name: signing-test
on:
  push:
    branches: [ ci-signing-test ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: |
          keytool -genkeypair -keystore $RUNNER_TEMP/t.jks -alias upload -keyalg RSA -keysize 2048 -validity 100 -storepass testpass -keypass testpass -dname "CN=t"
          SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/t.jks SIGNING_STORE_PASSWORD=testpass SIGNING_KEY_PASSWORD=testpass SIGNING_KEY_ALIAS=upload VERSION_CODE=99 gradle bundleRelease assembleRelease --no-daemon
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release
